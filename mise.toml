#:schema https://mise.en.dev/schema/mise.json
min_version = "2026.5.3"

# Monorepo mode: each workspace (see [monorepo].config_roots) owns its own
# file-based tasks, addressed as //<workspace>:<task>. Root-level tasks live in
# ./mise-tasks and are addressed as //:<task>. No npm scripts are used anywhere.
experimental_monorepo_root = true

[settings]
experimental = true
lockfile = true
minimum_release_age = "5d"
npm.package_manager = "auto"

[monorepo]
config_roots = ["defend-game-client", "web"]

[tools]
aube = "latest"
node = "24"
"npm:@fission-ai/openspec" = "latest"
